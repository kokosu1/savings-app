<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏦 貯金達成アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #F2EDE4;
    --card:     #FFFDF9;
    --primary:  #2A5C45;
    --accent:   #6DBF8A;
    --warn:     #E07A5F;
    --gold:     #F2A65A;
    --text:     #1A1A1A;
    --sub:      #7A7468;
    --border:   #DDD8CE;
    --shadow:   0 4px 24px rgba(42,92,69,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── ヘッダー ── */
  header {
    background: var(--primary);
    padding: 20px 24px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  .header-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left h1 {
    font-size: 1.3rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: .03em;
  }
  .header-left .total {
    font-size: .8rem;
    color: var(--accent);
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
  }
  .btn-add {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 2px 8px rgba(109,191,138,.4);
    flex-shrink: 0;
  }
  .btn-add:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(109,191,138,.5); }

  /* ── メイン ── */
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  /* ── 空状態 ── */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--sub);
  }
  .empty .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty p { font-size: .95rem; line-height: 1.7; }

  /* ── カード ── */
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: fadeUp .3s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .goal-name {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.3;
    max-width: 65%;
  }
  .pct-badge {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    font-weight: 500;
    color: var(--primary);
    background: #E8F5EE;
    border-radius: 20px;
    padding: 2px 10px;
    white-space: nowrap;
  }
  .pct-badge.achieved { color: var(--warn); background: #FDF0EB; }

  .amounts {
    font-size: .82rem;
    color: var(--sub);
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }
  .remaining {
    font-size: .8rem;
    margin-bottom: 10px;
    font-weight: 700;
    color: var(--warn);
  }
  .remaining.done { color: var(--primary); }

  /* 進捗バー */
  .bar-bg {
    background: var(--border);
    border-radius: 99px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  .bar-fill.achieved {
    background: linear-gradient(90deg, var(--gold), var(--warn));
  }

  /* ボタン群 */
  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 6px 14px;
    border-radius: 10px;
    border: none;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-deposit  { background: var(--primary); color: #fff; }
  .btn-history  { background: #E8F5EE; color: var(--primary); }
  .btn-edit     { background: #F0EEEA; color: var(--sub); }
  .btn-delete   { background: #FDF0EB; color: var(--warn); }

  /* ── モーダル ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card);
    width: 100%; max-width: 680px;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 40px;
    transform: translateY(40px);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .overlay.show .modal { transform: translateY(0); }
  .modal h2 {
    font-size: 1.1rem;
    font-weight: 900;
    margin-bottom: 20px;
    color: var(--primary);
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: .8rem;
    color: var(--sub);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-save {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 900;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .15s;
  }
  .btn-save:hover { opacity: .88; }
  .btn-cancel {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: var(--sub);
    border: none;
    font-size: .85rem;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    cursor: pointer;
    margin-top: 6px;
  }

  /* 履歴リスト */
  .history-list { max-height: 55vh; overflow-y: auto; }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .history-item:last-child { border-bottom: none; }
  .history-date { font-size: .75rem; color: var(--sub); }
  .history-memo { font-size: .85rem; margin-top: 2px; }
  .history-amount {
    font-family: 'DM Mono', monospace;
    font-size: .95rem;
    font-weight: 500;
    color: var(--primary);
    white-space: nowrap;
  }
  .history-empty {
    text-align: center;
    padding: 32px;
    color: var(--sub);
    font-size: .9rem;
  }

  /* トースト */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--primary);
    color: #fff;
    padding: 10px 22px;
    border-radius: 99px;
    font-size: .85rem;
    font-weight: 700;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <h1>🏦 貯金達成アプリ</h1>
      <div class="total" id="totalLabel">総貯金額: ¥0</div>
    </div>
    <button class="btn-add" onclick="openAddModal()">＋</button>
  </div>
</header>

<main id="goalList">
  <div class="empty">
    <div class="icon">🪙</div>
    <p>読み込み中...</p>
  </div>
</main>

<!-- 目標追加・編集モーダル -->
<div class="overlay" id="goalModal" onclick="closeOnBg(event,'goalModal')">
  <div class="modal">
    <h2 id="goalModalTitle">新しい目標</h2>
    <div class="field">
      <label>目標名</label>
      <input type="text" id="inputName" placeholder="例：旅行、新しいPC...">
    </div>
    <div class="field">
      <label>目標金額（円）</label>
      <input type="number" id="inputTarget" placeholder="例：100000" min="1">
    </div>
    <button class="btn-save" onclick="saveGoal()">✅ 保存する</button>
    <button class="btn-cancel" onclick="closeModal('goalModal')">キャンセル</button>
  </div>
</div>

<!-- 入金モーダル -->
<div class="overlay" id="depositModal" onclick="closeOnBg(event,'depositModal')">
  <div class="modal">
    <h2 id="depositModalTitle">💰 入金</h2>
    <div class="field">
      <label>金額（円）</label>
      <input type="number" id="inputAmount" placeholder="例：5000" min="1">
    </div>
    <div class="field">
      <label>メモ（任意）</label>
      <input type="text" id="inputMemo" placeholder="例：給料日分、節約分...">
    </div>
    <button class="btn-save" onclick="saveDeposit()">💰 入金する</button>
    <button class="btn-cancel" onclick="closeModal('depositModal')">キャンセル</button>
  </div>
</div>

<!-- 履歴モーダル -->
<div class="overlay" id="historyModal" onclick="closeOnBg(event,'historyModal')">
  <div class="modal">
    <h2 id="historyModalTitle">📋 入金履歴</h2>
    <div class="history-list" id="historyList"></div>
    <button class="btn-cancel" onclick="closeModal('historyModal')">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let goals = [];
let editingGoalId = null;
let depositingGoalId = null;

// ── データ取得・描画 ──────────────────────
async function loadGoals() {
  const res = await fetch('/api/goals');
  goals = await res.json();
  renderGoals();
}

function renderGoals() {
  const el = document.getElementById('goalList');
  const total = goals.reduce((s, g) => s + g.saved, 0);
  document.getElementById('totalLabel').textContent = `総貯金額: ¥${fmt(total)}`;

  if (goals.length === 0) {
    el.innerHTML = `<div class="empty"><div class="icon">🪙</div><p>右上の ＋ ボタンで<br>目標を追加しましょう！</p></div>`;
    return;
  }

  el.innerHTML = goals.map((g, i) => `
    <div class="card" style="animation-delay:${i*0.05}s">
      <div class="card-header">
        <div class="goal-name">${g.achieved ? '🎉 ' : ''}${esc(g.name)}</div>
        <div class="pct-badge ${g.achieved ? 'achieved' : ''}">${g.percent}%</div>
      </div>
      <div class="amounts">貯金済 ¥${fmt(g.saved)} ／ 目標 ¥${fmt(g.target)}</div>
      <div class="remaining ${g.achieved ? 'done' : ''}">
        ${g.achieved ? '✅ 目標達成！' : `残り ¥${fmt(g.remaining)}`}
      </div>
      <div class="bar-bg">
        <div class="bar-fill ${g.achieved ? 'achieved' : ''}" style="width:${g.percent}%"></div>
      </div>
      <div class="card-actions">
        <button class="btn btn-deposit" onclick="openDepositModal(${g.id})">💰 入金</button>
        <button class="btn btn-history" onclick="openHistoryModal(${g.id})">📋 履歴</button>
        <button class="btn btn-edit"    onclick="openEditModal(${g.id})">✏️ 編集</button>
        <button class="btn btn-delete"  onclick="deleteGoal(${g.id})">🗑 削除</button>
      </div>
    </div>
  `).join('');
}

// ── 目標追加・編集 ───────────────────────
function openAddModal() {
  editingGoalId = null;
  document.getElementById('goalModalTitle').textContent = '新しい目標';
  document.getElementById('inputName').value = '';
  document.getElementById('inputTarget').value = '';
  showModal('goalModal');
}

function openEditModal(id) {
  const g = goals.find(g => g.id === id);
  if (!g) return;
  editingGoalId = id;
  document.getElementById('goalModalTitle').textContent = '✏️ 目標を編集';
  document.getElementById('inputName').value = g.name;
  document.getElementById('inputTarget').value = g.target;
  showModal('goalModal');
}

async function saveGoal() {
  const name   = document.getElementById('inputName').value.trim();
  const target = parseFloat(document.getElementById('inputTarget').value);
  if (!name)          { showToast('⚠️ 目標名を入力してください'); return; }
  if (!target || target <= 0) { showToast('⚠️ 正しい金額を入力してください'); return; }

  const url    = editingGoalId ? `/api/goals/${editingGoalId}` : '/api/goals';
  const method = editingGoalId ? 'PUT' : 'POST';
  await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, target })
  });
  closeModal('goalModal');
  showToast(editingGoalId ? '✅ 更新しました' : '🎯 目標を追加しました');
  loadGoals();
}

// ── 入金 ─────────────────────────────────
function openDepositModal(id) {
  depositingGoalId = id;
  const g = goals.find(g => g.id === id);
  document.getElementById('depositModalTitle').textContent = `💰 入金：${g.name}`;
  document.getElementById('inputAmount').value = '';
  document.getElementById('inputMemo').value = '';
  showModal('depositModal');
}

async function saveDeposit() {
  const amount = parseFloat(document.getElementById('inputAmount').value);
  const memo   = document.getElementById('inputMemo').value.trim();
  if (!amount || amount <= 0) { showToast('⚠️ 正しい金額を入力してください'); return; }

  await fetch(`/api/goals/${depositingGoalId}/deposits`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ amount, memo })
  });
  closeModal('depositModal');
  showToast('💰 入金しました！');
  loadGoals();
}

// ── 履歴 ─────────────────────────────────
async function openHistoryModal(id) {
  const g = goals.find(g => g.id === id);
  document.getElementById('historyModalTitle').textContent = `📋 ${g.name} の履歴`;
  document.getElementById('historyList').innerHTML = '<div class="history-empty">読み込み中...</div>';
  showModal('historyModal');

  const res = await fetch(`/api/goals/${id}/deposits`);
  const deposits = await res.json();
  const el = document.getElementById('historyList');

  if (deposits.length === 0) {
    el.innerHTML = '<div class="history-empty">まだ入金履歴がありません</div>';
    return;
  }
  el.innerHTML = deposits.map(d => `
    <div class="history-item">
      <div>
        <div class="history-date">${d.created_at}</div>
        <div class="history-memo">${d.memo ? esc(d.memo) : '（メモなし）'}</div>
      </div>
      <div class="history-amount">¥${fmt(d.amount)}</div>
    </div>
  `).join('');
}

// ── 削除 ─────────────────────────────────
async function deleteGoal(id) {
  const g = goals.find(g => g.id === id);
  if (!confirm(`「${g.name}」を削除しますか？\n入金履歴も全て消えます。`)) return;
  await fetch(`/api/goals/${id}`, { method: 'DELETE' });
  showToast('🗑 削除しました');
  loadGoals();
}

// ── モーダル開閉 ──────────────────────────
function showModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
function closeOnBg(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}

// ── トースト ──────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── ユーティリティ ────────────────────────
function fmt(n) { return Number(n).toLocaleString('ja-JP'); }
function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── 初期ロード ────────────────────────────
loadGoals();
</script>
</body>
</html>
