<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealth Obsidian Savings</title>
    <!-- Premium Google Fonts (No-nonsense sans-serif typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js for minimalist visuals inside cards -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* --- Stealth Obsidian Design Tokens (Zero Fluff, High Contrast) --- */
        :root {
            --bg-base: #050505; /* Pure Deep Black */
            --glass-bg: rgba(20, 20, 20, 0.85); /* Deep solid smoke obsidian */
            --glass-border: rgba(255, 255, 255, 0.05); /* Stealth edge */
            --glass-border-active: rgba(255, 255, 255, 0.12);
            --text-main: #f3f4f6; /* Off-white */
            --text-muted: #6b7280; /* Cool Gray */
            --accent-red: #e11d48; /* Stealth Red (ThinkPad Red) */
            --accent-white: #ffffff;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        /* --- Minimalist Background Sheen (No colorful orbs) --- */
        .ambient-container {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Sleek subtle gray vignette for depth */
        .ambient-container::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.015) 0%, transparent 60%);
            z-index: 0;
        }

        /* --- Layout Container --- */
        .container {
            width: 100%;
            max-width: 480px; /* Mobile viewport standard */
            padding: 24px 16px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Minimal Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1 span {
            color: var(--accent-red);
        }

        /* --- Stealth Wallet Banner --- */
        .wallet-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-info {
            display: flex;
            flex-direction: column;
        }

        .wallet-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .wallet-amount {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Subtle indicator light */
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
        }

        /* --- Goal List --- */
        .goals-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- Stealth Interactive Card --- */
        .goal-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .goal-card:active {
            transform: scale(0.995);
        }

        .goal-card.expanded {
            border-color: var(--glass-border-active);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .card-title h2 {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .percent-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-red);
            background: rgba(225, 29, 72, 0.08);
            border: 1px solid rgba(225, 29, 72, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Progress line */
        .progress-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-red);
            border-radius: 2px;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .amount-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
        }

        .saved-numerical {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .target-numerical {
            color: var(--text-muted);
        }

        /* Minimal Toggle Indicator */
        .tap-hint {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tap-hint i {
            transition: transform 0.25s ease;
        }

        .goal-card.expanded .tap-hint i {
            transform: rotate(180deg);
            color: var(--accent-red);
        }

        /* ───────────────── EXPANDABLE DETAILS AREA ───────────────── */
        .detail-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-top: 1px solid transparent;
            padding-top: 0;
            margin-top: 0;
        }

        .goal-card.expanded .detail-section {
            max-height: 500px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
            margin-top: 2px;
        }

        /* Clean Split Grid */
        .detail-grid {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 16px;
            align-items: center;
        }

        /* Mono progress ring */
        .chart-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
        }

        /* Timeline deposits list (Stealth Minimalist) */
        .history-timeline {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 110px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-timeline::-webkit-scrollbar {
            width: 3px;
        }
        .history-timeline::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1px;
        }

        .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 6px;
        }

        .timeline-left {
            display: flex;
            flex-direction: column;
        }

        .timeline-amt {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
        }

        .timeline-memo {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .timeline-date {
            font-size: 9px;
            color: #4b5563;
        }

        /* Drawer Actions Bar */
        .drawer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        /* --- Buttons System --- */
        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            border-radius: 8px;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 600;
            font-size: 12px;
        }

        /* Round plus header button */
        .btn-plus {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            font-size: 14px;
        }

        .btn-plus:active {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 12px;
        }

        .btn-glass:active {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .btn-accent {
            background: var(--accent-red);
            color: #ffffff;
            padding: 8px 14px;
        }

        .btn-accent:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn-submit {
            background: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            margin-top: 8px;
        }

        .btn-submit:active {
            opacity: 0.9;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            opacity: 0.6;
            padding: 8px 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 12px;
        }

        .btn-delete:hover {
            color: var(--danger);
            opacity: 1;
        }

        /* --- Modals & Dark Inputs --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            width: 90%;
            max-width: 350px;
            padding: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.97);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .close-modal {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
        }

        .close-modal:hover {
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .chip-container {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
        }

        .chip:active {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .empty-state {
            padding: 50px 10px;
            text-align: center;
        }

        .empty-state i {
            font-size: 24px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Stealth subtle background glow -->
    <div class="ambient-container"></div>

    <div class="container">
        <!-- --- Top Stealth Header --- -->
        <header>
            <div class="logo-section">
                <h1>Obsidian<span>.</span></h1>
            </div>
            <button class="btn btn-plus" onclick="openModal('addGoalModal')" title="目標を追加">
                <i class="fa-solid fa-plus"></i>
            </button>
        </header>

        <!-- --- Stealth Wallet (Total Balance) --- -->
        <div class="wallet-card">
            <div class="wallet-info">
                <span class="wallet-label">トータル貯金合計</span>
                <span class="wallet-amount" id="global-total">¥0</span>
            </div>
            <div class="status-dot" title="Database Connected"></div>
        </div>

        <!-- --- Goal Cards Stack --- -->
        <main class="goals-list" id="goals-container">
            <div class="empty-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <h3>起動中</h3>
            </div>
        </main>
    </div>

    <!-- ── 1. Create New Goal Popup Modal ── -->
    <div class="modal-overlay" id="addGoalModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>目標を追加</h3>
                <button class="close-modal" onclick="closeModal('addGoalModal')">&times;</button>
            </div>
            <form id="add-goal-form" onsubmit="submitAddGoal(event)">
                <div class="form-group">
                    <label for="goal-name">目標名</label>
                    <input type="text" id="goal-name" class="form-input" placeholder="例: 普通車MT免許代" required>
                </div>
                <div class="form-group">
                    <label for="goal-target">目標金額 (円)</label>
                    <input type="number" id="goal-target" class="form-input" placeholder="例: 340000" min="1" required>
                </div>
                <button type="submit" class="btn btn-submit">登録</button>
            </form>
        </div>
    </div>

    <!-- ── 2. Deposit Action Popup Modal ── -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>貯金を記録</h3>
                <button class="close-modal" onclick="closeModal('depositModal')">&times;</button>
            </div>
            <form id="deposit-form" onsubmit="submitDeposit(event)">
                <input type="hidden" id="deposit-goal-id">
                <div class="form-group">
                    <label for="deposit-amount">入金額 (円)</label>
                    <input type="number" id="deposit-amount" class="form-input" placeholder="金額を入力" min="1" required>
                    <div class="chip-container">
                        <div class="chip" onclick="setQuickAmount(1000)">+1,000</div>
                        <div class="chip" onclick="setQuickAmount(5000)">+5,000</div>
                        <div class="chip" onclick="setQuickAmount(10000)">+10,000</div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="deposit-memo">メモ</label>
                    <input type="text" id="deposit-memo" class="form-input" placeholder="例: お釣り、バイト代から">
                </div>
                <button type="submit" class="btn btn-submit" style="background:var(--accent-red); color:#ffffff;">入金を確定</button>
            </form>
        </div>
    </div>

    <!-- ── Client Logic System ── -->
    <script>
        let goalsData = [];
        let chartInstances = {};

        document.addEventListener('DOMContentLoaded', () => fetchGoals());

        function formatCurrency(val) {
            return '¥' + parseInt(val).toLocaleString();
        }

        async function fetchGoals() {
            try {
                const res = await fetch('/api/goals');
                goalsData = await res.json();
                renderHome();
            } catch (err) {
                console.error("Database disconnected", err);
            }
        }

        function renderHome() {
            const container = document.getElementById('goals-container');
            if (goalsData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-cube"></i>
                        <h3>目標が設定されていません</h3>
                        <p>右上の「＋」から新しい貯金目標を追加してください。</p>
                    </div>
                `;
                document.getElementById('global-total').innerText = '¥0';
                return;
            }

            let html = '';
            let globalTotal = 0;

            goalsData.forEach(g => {
                globalTotal += g.saved;
                const percent = Math.min(Math.round((g.saved / g.target) * 100), 100);

                html += `
                    <div class="goal-card" onclick="toggleCard(event, this, ${g.id})" data-id="${g.id}">
                        <div class="card-header-row">
                            <div class="card-title">
                                <h2>${escapeHtml(g.name)}</h2>
                            </div>
                            <span class="percent-badge">${percent}%</span>
                        </div>

                        <div class="progress-block">
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${percent}%;"></div>
                            </div>
                            <div class="amount-info">
                                <div>
                                    <span class="saved-numerical">${formatCurrency(g.saved)}</span>
                                    <span class="target-numerical"> / ${formatCurrency(g.target)}</span>
                                </div>
                            </div>
                        </div>

                        <!-- ── EXPANDABLE DETAIL DRAWER AREA ── -->
                        <div class="detail-section" onclick="event.stopPropagation()">
                            <div class="detail-grid">
                                <!-- Minimal Mono Ring Chart -->
                                <div class="chart-wrapper">
                                    <canvas id="miniChart-${g.id}"></canvas>
                                </div>
                                
                                <!-- Inside-card Scrollable Timeline -->
                                <div class="history-timeline" id="timeline-${g.id}">
                                    <p style="font-size:10px; color:var(--text-muted); text-align:center; padding:10px;">読込中</p>
                                </div>
                            </div>

                            <div class="drawer-actions">
                                <button class="btn btn-delete" onclick="deleteGoal(event, ${g.id})">
                                    <i class="fa-solid fa-trash-can"></i> 削除
                                </button>
                                <button class="btn btn-accent" onclick="triggerDepositModal(event, ${g.id})">
                                    <i class="fa-solid fa-plus"></i> 貯金
                                </button>
                            </div>
                        </div>

                        <div class="tap-hint">
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('global-total').innerText = formatCurrency(globalTotal);
        }

        function toggleCard(event, cardElement, goalId) {
            if (event.target.closest('.btn') || event.target.closest('.detail-section')) {
                return;
            }

            const isExpanded = cardElement.classList.contains('expanded');
            
            document.querySelectorAll('.goal-card').forEach(card => {
                if (card !== cardElement) {
                    card.classList.remove('expanded');
                }
            });

            if (isExpanded) {
                cardElement.classList.remove('expanded');
            } else {
                cardElement.classList.add('expanded');
                loadCardDetails(goalId);
            }
        }

        async function loadCardDetails(goalId) {
            const goalObj = goalsData.find(g => g.id === goalId);
            if (!goalObj) return;

            // Render minimalist monochrome ring
            setTimeout(() => {
                renderMiniChart(goalId, goalObj.saved, goalObj.target);
            }, 50);

            const timelineContainer = document.getElementById(`timeline-${goalId}`);
            try {
                const res = await fetch(`/api/goals/${goalId}/deposits`);
                const history = await res.json();
                
                if (history.length === 0) {
                    timelineContainer.innerHTML = '<p style="text-align:center; padding:20px 10px; font-size:10px; color:var(--text-muted);">履歴はありません</p>';
                    return;
                }

                let html = '';
                history.forEach(item => {
                    const d = new Date(item.created_at);
                    const dateStr = isNaN(d) ? item.created_at : `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    html += `
                        <div class="timeline-item">
                            <div class="timeline-left">
                                <span class="timeline-amt">+${formatCurrency(item.amount)}</span>
                                <span class="timeline-memo">${escapeHtml(item.memo || 'なし')}</span>
                            </div>
                            <span class="timeline-date">${dateStr}</span>
                        </div>
                    `;
                });
                timelineContainer.innerHTML = html;
            } catch (err) {
                timelineContainer.innerHTML = '<p style="font-size:10px; color:var(--danger)">接続エラー</p>';
            }
        }

        function renderMiniChart(id, saved, target) {
            const canvasId = `miniChart-${id}`;
            const canvasElement = document.getElementById(canvasId);
            if (!canvasElement) return;

            const ctx = canvasElement.getContext('2d');
            if (chartInstances[id]) {
                chartInstances[id].destroy();
            }

            const remaining = Math.max(target - saved, 0);

            chartInstances[id] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [saved, remaining],
                        // White / Dark Gray for minimalist contrast
                        backgroundColor: ['#ffffff', 'rgba(255, 255, 255, 0.03)'],
                        borderColor: 'transparent',
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '80%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    }
                }
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        async function submitAddGoal(event) {
            event.preventDefault();
            const name = document.getElementById('goal-name').value;
            const target = document.getElementById('goal-target').value;

            try {
                const res = await fetch('/api/goals', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, target: parseFloat(target) })
                });
                if (res.ok) {
                    document.getElementById('goal-name').value = '';
                    document.getElementById('goal-target').value = '';
                    closeModal('addGoalModal');
                    fetchGoals();
                }
            } catch (err) { console.error(err); }
        }

        function triggerDepositModal(event, id) {
            event.stopPropagation();
            document.getElementById('deposit-goal-id').value = id;
            document.getElementById('deposit-amount').value = '';
            document.getElementById('deposit-memo').value = '';
            openModal('depositModal');
        }

        function setQuickAmount(amt) {
            document.getElementById('deposit-amount').value = amt;
        }

        async function submitDeposit(event) {
            event.preventDefault();
            const id = document.getElementById('deposit-goal-id').value;
            const amount = document.getElementById('deposit-amount').value;
            const memo = document.getElementById('deposit-memo').value;

            try {
                const res = await fetch(`/api/goals/${id}/deposits`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: parseFloat(amount), memo: memo })
                });
                if (res.ok) {
                    closeModal('depositModal');
                    await fetchGoals();
                    
                    const activeCard = document.querySelector(`.goal-card[data-id="${id}"]`);
                    if (activeCard) {
                        activeCard.classList.add('expanded');
                        loadCardDetails(parseInt(id));
                    }
                }
            } catch (err) { console.error(err); }
        }

        async function deleteGoal(event, id) {
            event.stopPropagation();
            if (!confirm('この目標を削除しますか？\n(履歴もすべて消去されます)')) return;
            try {
                const res = await fetch(`/api/goals/${id}`, { method: 'DELETE' });
                if (res.ok) fetchGoals();
            } catch (err) { console.error(err); }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>
