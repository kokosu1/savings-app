<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Savings Dashboard</title>
    <!-- Elegant, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* CSS Variables for theme consistency */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.35);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #4f46e5;
            --secondary: #0d9488;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #eef2f6 0%, #e0e7ff 50%, #f0fdf4 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 30px 15px;
        }

        /* Animated background mesh gradients for enhanced glassmorphism effect */
        .bg-glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            top: 10%;
            left: -100px;
            z-index: 0;
            pointer-events: none;
            animation: floating 12s infinite alternate ease-in-out;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(13, 148, 136, 0.15) 0%, transparent 70%);
            bottom: 10%;
            right: -150px;
            z-index: 0;
            pointer-events: none;
            animation: floating 16s infinite alternate-reverse ease-in-out;
        }

        @keyframes floating {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* --- Header Styles (Glassmorphism card) --- */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            padding: 24px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-section h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .total-badge {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.1) 0%, rgba(13, 148, 136, 0.1) 100%);
            border: 1px solid rgba(79, 70, 229, 0.2);
            padding: 10px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .total-badge i {
            color: var(--primary);
            font-size: 20px;
        }

        .total-amount-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .total-amount-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* --- Action Buttons --- */
        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            border-radius: 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: #ffffff;
            padding: 12px 24px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 16px;
        }

        .btn-secondary:hover {
            background: #ffffff;
            color: var(--text-main);
        }

        /* --- Main Goals Grid --- */
        .goals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Empty state style */
        .empty-state {
            grid-column: 1 / -1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: var(--glass-shadow);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--primary);
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .empty-state p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* --- Goal Card Design (Glassmorphism layout) --- */
        .goal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .goal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.12);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            opacity: 0.6;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.08);
        }

        /* Center Ring Progress section */
        .progress-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .progress-ring-container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring__circle-bg {
            stroke: rgba(79, 70, 229, 0.06);
        }

        .progress-ring__circle {
            stroke-dasharray: 377;
            stroke-dashoffset: 377;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .progress-percentage {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            display: block;
        }

        .progress-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* Card details values */
        .card-amounts {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.3);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .amount-item span {
            display: block;
        }

        .amount-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .amount-value {
            font-size: 16px;
            font-weight: 700;
        }

        .amount-value.saved {
            color: var(--primary);
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* --- Modal Design (Glassmorphism layout) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            width: 90%;
            max-width: 480px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        .close-modal {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-modal:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-main);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        /* Quick Amount Suggestion Chips */
        .chips-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .chip {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Deposit History Modal items */
        .history-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-radius: 12px;
            padding-right: 5px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-info span {
            display: block;
        }

        .history-amount {
            font-weight: 700;
            color: var(--secondary);
            font-size: 15px;
        }

        .history-memo {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .history-date {
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Ambient glow decorative spots -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <!-- --- Header --- -->
        <header>
            <div class="logo-section">
                <h1><i class="fa-solid fa-sparkles"></i> Sparkly Savings</h1>
            </div>
            
            <div class="total-badge">
                <i class="fa-solid fa-piggy-bank"></i>
                <div>
                    <span class="total-amount-label">トータル貯金額</span>
                    <span class="total-amount-value" id="global-total">¥0</span>
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="openModal('addGoalModal')">
                <i class="fa-solid fa-plus"></i> 新しい目標を追加
            </button>
        </header>

        <!-- --- Goals List Area --- -->
        <main class="goals-grid" id="goals-container">
            <!-- Dynamic Cards injected here -->
            <div class="empty-state">
                <i class="fa-solid fa-face-smile"></i>
                <h3>貯金目標を設定しましょう</h3>
                <p>最初の目標を追加して、楽しい貯金生活をスタート！</p>
                <button class="btn btn-primary" onclick="openModal('addGoalModal')">最初の目標を追加</button>
            </div>
        </main>
    </div>

    <!-- ── 1. 目標追加 モーダル ────────────────────────────── -->
    <div class="modal-overlay" id="addGoalModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>目標を作成</h3>
                <button class="close-modal" onclick="closeModal('addGoalModal')">&times;</button>
            </div>
            <form id="add-goal-form" onsubmit="submitAddGoal(event)">
                <div class="form-group">
                    <label for="goal-name">目標の名前</label>
                    <input type="text" id="goal-name" class="form-control" placeholder="例：普通車MT免許代、温泉旅行" required>
                </div>
                <div class="form-group">
                    <label for="goal-target">目標金額 (円)</label>
                    <input type="number" id="goal-target" class="form-control" placeholder="例：340000" min="1" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">目標を作成する</button>
            </form>
        </div>
    </div>

    <!-- ── 2. 入金 モーダル ────────────────────────────── -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>貯金を記録する</h3>
                <button class="close-modal" onclick="closeModal('depositModal')">&times;</button>
            </div>
            <form id="deposit-form" onsubmit="submitDeposit(event)">
                <input type="hidden" id="deposit-goal-id">
                <div class="form-group">
                    <label for="deposit-amount">入金額 (円)</label>
                    <input type="number" id="deposit-amount" class="form-control" placeholder="金額を入力" min="1" required>
                    <div class="chips-container">
                        <div class="chip" onclick="setQuickAmount(1000)">+¥1,000</div>
                        <div class="chip" onclick="setQuickAmount(5000)">+¥5,000</div>
                        <div class="chip" onclick="setQuickAmount(10000)">+¥10,000</div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="deposit-memo">メモ (任意)</label>
                    <input type="text" id="deposit-memo" class="form-control" placeholder="例：バイト代から、お釣り">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">入金を確定する</button>
            </form>
        </div>
    </div>

    <!-- ── 3. 入金履歴 モーダル ────────────────────────────── -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="history-modal-title">入金履歴</h3>
                <button class="close-modal" onclick="closeModal('historyModal')">&times;</button>
            </div>
            <div class="history-list" id="history-container">
                <!-- Injected dynamically -->
            </div>
            <button class="btn btn-secondary" onclick="closeModal('historyModal')" style="width: 100%">閉じる</button>
        </div>
    </div>

    <!-- ── Javascript Logic & API Integration ── -->
    <script>
        // Load on start
        document.addEventListener('DOMContentLoaded', () => {
            fetchGoals();
        });

        // Helper to format currency values
        function formatCurrency(val) {
            return '¥' + parseInt(val).toLocaleString();
        }

        // ── API: Load all goals and build cards ──
        async function fetchGoals() {
            try {
                const res = await fetch('/api/goals');
                const goals = await res.json();
                renderGoals(goals);
            } catch (err) {
                console.error("Failed to load goals", err);
            }
        }

        function renderGoals(goals) {
            const container = document.getElementById('goals-container');
            
            if (goals.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-face-smile"></i>
                        <h3>貯金目標を設定しましょう</h3>
                        <p>最初の目標を追加して、楽しい貯金生活をスタート！</p>
                        <button class="btn btn-primary" onclick="openModal('addGoalModal')">最初の目標を追加</button>
                    </div>
                `;
                document.getElementById('global-total').innerText = '¥0';
                return;
            }

            let html = '';
            let globalTotal = 0;

            goals.forEach(g => {
                globalTotal += g.saved;
                const percent = Math.min(Math.round((g.saved / g.target) * 100), 100);
                
                // SVG ring offset (circumference of r=60 is 2 * PI * 60 ≈ 377)
                const circumference = 377;
                const offset = circumference - (percent / 100) * circumference;

                html += `
                    <div class="goal-card" id="goal-${g.id}">
                        <div class="card-header">
                            <h2>${escapeHtml(g.name)}</h2>
                            <button class="delete-btn" onclick="deleteGoal(${g.id})" title="目標を削除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>

                        <div class="progress-section">
                            <div class="progress-ring-container">
                                <svg class="progress-ring" width="150" height="150">
                                    <!-- Background circle track -->
                                    <circle class="progress-ring__circle-bg" stroke-width="8" fill="transparent" r="60" cx="75" cy="75" />
                                    <!-- Colored progress bar inside -->
                                    <circle class="progress-ring__circle" stroke="url(#gradient-${g.id})" stroke-width="8" fill="transparent" r="60" cx="75" cy="75" style="stroke-dashoffset: ${offset};" />
                                    
                                    <!-- Linear Gradient per card to avoid color issues -->
                                    <defs>
                                        <linearGradient id="gradient-${g.id}" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stop-color="var(--primary)" />
                                            <stop offset="100%" stop-color="var(--secondary)" />
                                        </linearGradient>
                                    </defs>
                                </svg>
                                <div class="progress-text">
                                    <span class="progress-percentage">${percent}%</span>
                                    <span class="progress-label">達成率</span>
                                </div>
                            </div>
                        </div>

                        <div class="card-amounts">
                            <div class="amount-item">
                                <span class="amount-title">貯まった額</span>
                                <span class="amount-value saved">${formatCurrency(g.saved)}</span>
                            </div>
                            <div class="amount-item" style="text-align: right;">
                                <span class="amount-title">目標金額</span>
                                <span class="amount-value">${formatCurrency(g.target)}</span>
                            </div>
                        </div>

                        <div class="card-actions">
                            <button class="btn btn-secondary" onclick="viewHistory(${g.id}, '${escapeHtml(g.name)}')">
                                <i class="fa-solid fa-list-ul"></i> 履歴
                            </button>
                            <button class="btn btn-primary" onclick="triggerDepositModal(${g.id})">
                                <i class="fa-solid fa-piggy-bank"></i> 貯金する
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('global-total').innerText = formatCurrency(globalTotal);
        }

        // Helper to avoid script injection
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ── API: Add New Goal ──
        async function submitAddGoal(event) {
            event.preventDefault();
            const nameInput = document.getElementById('goal-name');
            const targetInput = document.getElementById('goal-target');

            try {
                const res = await fetch('/api/goals', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nameInput.value,
                        target: parseFloat(targetInput.value)
                    })
                });

                if (res.ok) {
                    nameInput.value = '';
                    targetInput.value = '';
                    closeModal('addGoalModal');
                    fetchGoals();
                } else {
                    alert('目標の追加に失敗しました。');
                }
            } catch (err) {
                console.error("Error creating goal", err);
            }
        }

        // ── API: Quick Deposit Trigger ──
        function triggerDepositModal(id) {
            document.getElementById('deposit-goal-id').value = id;
            document.getElementById('deposit-amount').value = '';
            document.getElementById('deposit-memo').value = '';
            openModal('depositModal');
        }

        function setQuickAmount(amt) {
            document.getElementById('deposit-amount').value = amt;
        }

        async function submitDeposit(event) {
            event.preventDefault();
            const id = document.getElementById('deposit-goal-id').value;
            const amount = document.getElementById('deposit-amount').value;
            const memo = document.getElementById('deposit-memo').value;

            try {
                const res = await fetch(`/api/goals/${id}/deposits`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        memo: memo
                    })
                });

                if (res.ok) {
                    closeModal('depositModal');
                    fetchGoals();
                } else {
                    alert('入金に失敗しました。');
                }
            } catch (err) {
                console.error("Error making deposit", err);
            }
        }

        // ── API: View Deposit History ──
        async function viewHistory(id, name) {
            document.getElementById('history-modal-title').innerText = `${name} の履歴`;
            const container = document.getElementById('history-container');
            container.innerHTML = '<p style="text-align:center; padding: 20px; color: var(--text-muted);">読み込み中...</p>';
            
            openModal('historyModal');

            try {
                const res = await fetch(`/api/goals/${id}/deposits`);
                const history = await res.json();

                if (history.length === 0) {
                    container.innerHTML = '<p style="text-align:center; padding: 40px 20px; color: var(--text-muted);"><i class="fa-solid fa-folder-open" style="font-size:24px; display:block; margin-bottom:10px; opacity:0.5;"></i>履歴はまだありません。</p>';
                    return;
                }

                let html = '';
                history.forEach(item => {
                    // Quick date cleanups for better UI presentation
                    const dateObj = new Date(item.created_at);
                    const formattedDate = isNaN(dateObj) ? item.created_at : `${dateObj.getMonth() + 1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2, '0')}`;

                    html += `
                        <div class="history-item">
                            <div class="history-info">
                                <span class="history-amount">+${formatCurrency(item.amount)}</span>
                                <span class="history-memo">${escapeHtml(item.memo || 'メモなし')}</span>
                            </div>
                            <span class="history-date">${formattedDate}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="text-align:center; color: #ef4444; padding:20px;">履歴の取得に失敗しました。</p>';
            }
        }

        // ── API: Delete Goal ──
        async function deleteGoal(id) {
            if (!confirm('この目標を削除してもよろしいですか？\n(これまでの入金データも一緒に削除されます)')) {
                return;
            }

            try {
                const res = await fetch(`/api/goals/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchGoals();
                } else {
                    alert('削除に失敗しました。');
                }
            } catch (err) {
                console.error("Error deleting goal", err);
            }
        }

        // ── Modal UI Helpers ──
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
    </script>
</body>
</html>
